plugins {
    id 'net.neoforged.moddev.legacyforge'
}

def mc = '1.20.1'
def forgeVersion = '1.20.1-47.3.0'
def mapVersion = '1.47.0'
def libVersion = '1.7.3'
def modVersion = providers.gradleProperty('mod_version').getOrElse('0.3.2')

version = "${modVersion}+${mc}-forge"
group = 'dev.herebynamed'
archivesBaseName = 'hereby-named'

legacyForge {
    version = forgeVersion
    validateAccessTransformers = false
    mods {
        "hereby_named" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDirs += project(':common').sourceSets.main.java.srcDirs
sourceSets.main.resources.srcDirs += project(':common').sourceSets.main.resources.srcDirs

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://chocolateminecraft.com/maven' }
}

dependencies {
    compileOnly "xaero.map:xaeroworldmap-forge-1.20.1:1.47.0:dev"
    compileOnly "xaero.lib:xaerolib-forge-1.20.1:1.7.3:dev"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', mc
    filesMatching('META-INF/mods.toml') {
        expand([
            'version': project.version,
            'minecraft_version': mc
        ])
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'hereby_named',
            'Specification-Vendor': 'herebynamed',
            'Specification-Version': '1',
            'Implementation-Title': 'hereby_named',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'herebynamed',
            'MixinConfigs': 'hereby_named.mixins.json'
        ])
    }
}
